        continue-on-error: true
        run: |
          mkdir -p out
          docker run --rm -v "$PWD:/workspace" -w /workspace archlinux:base-devel \
            bash build-kit/scripts/build/package.sh "${{ matrix.name }}" "${{ steps.meta.outputs.pkgbase }}" out ${{ steps.meta.outputs.aur_depends }}
      - name: resolve job url
        id: jobinfo
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            const job = data.jobs.find(j => j.name.includes('${{ matrix.name }}'));
            core.setOutput('url', job ? job.html_url
              : `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`);
      - name: write manifest
        if: always()
        run: |
          status="build_failed"
          [[ "${{ steps.build.outcome }}" == "success" ]] && status="built"
          cat > out/manifest.json <<EOF
          {"distro":"${{ matrix.distro }}","type":"${{ matrix.type }}","name":"${{ matrix.name }}","pkgbase":"${{ steps.meta.outputs.pkgbase }}","build_outcome":"$status","job_url":"${{ steps.jobinfo.outputs.url }}"}
          EOF
      - name: stage artifact filenames
        if: always()
        run: python3 build-kit/scripts/build/stage_artifact.py stage out artifact
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-${{ matrix.name }}
          path: artifact/
          if-no-files-found: warn

  publish:
    # No `always()` needed on the build-wave-* dependency itself: an
    # individual package's build step uses continue-on-error, so each wave
    # job still reports success even when some of its matrix legs failed
    # to build — that's what lets publish run and correctly mark just
    # those packages publish_failed. `always()` here is only to tolerate
    # empty (skipped) waves.
    needs: [detect-changes, build-wave-0, build-wave-1, build-wave-2, build-wave-3, build-wave-4]
    if: |
      always() && (
        needs.detect-changes.outputs.layer0 != '[]' ||
        needs.detect-changes.outputs.layer1 != '[]' ||
        needs.detect-changes.outputs.layer2 != '[]' ||
        needs.detect-changes.outputs.layer3 != '[]' ||
        needs.detect-changes.outputs.layer4 != '[]'
      )
    runs-on: ubuntu-latest
    # repo-add performs a read-modify-write of the shared R2 repository DB.
    # Serializing only this job keeps independent build waves parallel while
    # preventing a later uploader from overwriting another run's DB update.
    concurrency:
      group: akaere-r2-pacman-repository
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Akaere-s-Packages/workflow-build-kit
          ref: ${{ env.WORKFLOW_BUILD_KIT_REF }}
          path: build-kit
      - uses: actions/download-artifact@v4
        with:
          pattern: build-*
          path: artifacts

      - name: restore artifact filenames
        run: |
          for artifact_dir in artifacts/build-*/; do
            [[ -d "$artifact_dir" ]] || continue
            python3 build-kit/scripts/build/stage_artifact.py restore "$artifact_dir"
          done
      - name: sign, publish, and assemble final manifest (inside archlinux:base-devel)
        # repo-add/vercmp are part of the `pacman` package itself — there's
        # no apt equivalent and no portable static binary for them, so this
        # (unlike the rest of the job) has to run inside an actual Arch
        # container. One `docker run` for the whole job, not one per
        # package, so scripts/publish/publish_all.sh only installs mc and
        # imports the GPG key once.
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace \
            -e R2_ENDPOINT -e R2_ACCESS_KEY_ID -e R2_SECRET_ACCESS_KEY -e R2_BUCKET -e GPG_PASSPHRASE -e GPG_PRIVATE_KEY \
            archlinux:base-devel bash build-kit/scripts/publish/publish_all.sh

      - uses: actions/upload-artifact@v4
        with:
          name: built-manifest
          path: built_packages.json

  website-data:
    needs: publish
    # `always()` overrides the default "skip if any job in the whole
    # upstream chain was skipped" behavior — bare `success()` (what a job
    # with no `if:` gets implicitly) checks every transitively-needed job,
    # not just `publish` directly, and build-wave-1/build-wave-2 are
    # legitimately skipped whenever their layer is empty (the common case
    # for a dependency graph shallower than 3 levels). Without this, that
    # skip cascaded all the way through here even on a fully successful
    # publish. `needs.publish.result == 'success'` (not merely "ran") is
    # the actual condition that matters: publish's own job status stays
    # "success" even when some individual packages inside it end up
    # publish_failed (that's recorded in the artifact, not the job's exit
    # code) — only skip this if publish itself never produced its artifact.
    if: always() && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: registry
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: Akaere-s-Packages/workflow-build-kit
          ref: ${{ env.WORKFLOW_BUILD_KIT_REF }}
          path: build-kit
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.WEBSITE_KIT_REPO }}
          token: ${{ secrets.WEBSITE_KIT_PUSH_TOKEN }}
          path: website-kit
      - uses: actions/download-artifact@v4
        with:
          name: built-manifest
      - uses: actions/download-artifact@v4
        with:
          pattern: build-*
          path: artifacts
      - name: rewrite artifact_dir to this job's download path
        run: |
          python3 - <<'PY'
          import json
          data = json.load(open("built_packages.json"))
          for e in data:
              e["artifact_dir"] = f"artifacts/build-{e['name']}"
          json.dump(data, open("built_packages.json", "w"), indent=2)
          PY
      - name: generate website data
        run: |
          python3 build-kit/scripts/website/gen_data.py \
            --registry-root registry \
            --website-data-dir website-kit/src/_data \
            --built built_packages.json
      - name: commit and push
        working-directory: website-kit
        run: |
          git config user.name "Lilithya"
          git config user.email "me@lilithya.su"
          git add src/_data
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "chore: sync package data from Registry@${{ github.sha }}"
            git push
          fi

  update-readme:
    needs: website-data
    # Same cascade-skip issue as website-data above, one level further
    # down: website-data's own result now correctly reflects whether it
    # actually ran, so checking it directly (rather than reaching back to
    # publish/build-wave-*) is enough.
    if: always() && needs.website-data.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: registry
      - uses: actions/checkout@v4
        with:
          repository: Akaere-s-Packages/workflow-build-kit
          ref: ${{ env.WORKFLOW_BUILD_KIT_REF }}
          path: build-kit
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.WEBSITE_KIT_REPO }}
          path: website-kit
      - name: regenerate README package table
        run: |
          python3 build-kit/scripts/registry/update_readme.py \
            --registry-root registry \
            --website-data-dir website-kit/src/_data \
            --pages-domain "${{ env.PAGES_DOMAIN }}"
      - name: commit with the default token (does not retrigger this workflow)
        working-directory: registry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "no README changes"
          else
            git commit -m "chore: update package table"
            git push
          fi

  notify-failures:
    needs: publish
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: built-manifest
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const built = JSON.parse(fs.readFileSync('built_packages.json', 'utf8'));
            for (const pkg of built) {
              const title = `[build-failure] ${pkg.name}`;
              const { data: issues } = await github.rest.issues.listForRepo({
                owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'build-failure',
              });
              const existing = issues.find(i => i.title === title);
              if (pkg.build_status !== 'published') {
                const body = `Build/publish failed: \`${pkg.build_status}\`\n\n[View run log](${pkg.job_url})`;
                if (existing) {
                  await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
                } else {
                  await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['build-failure'] });
                }
              } else if (existing) {
                await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body: `Recovered, see [${pkg.job_url}](${pkg.job_url})` });
                await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, state: 'closed' });
              }
            }
