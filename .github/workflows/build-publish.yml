name: build-publish

# Called by Registry's own push-to-main workflow after a PR merges. Builds
# every changed package (plus anything hard-dependent on it, in dependency
# order — see scripts/registry/resolve_build_order.sh), GPG-signs and
# publishes the successful ones to the R2-backed pacman repo, refreshes
# WebSite-Kit's data, updates Registry/README.md, and opens/closes
# per-package failure Issues on Registry.
#
# Internal checkouts of this repo (workflow-build-kit) are pinned to
# `main` for simplicity; move to a tagged release once this is stable.

on:
  workflow_call:
    inputs:
      base-sha:
        description: Ignored unless this is a plain push (every other trigger below ignores it too).
        required: false
        type: string
      head-sha:
        description: Ignored unless this is a plain push (every other trigger below ignores it too).
        required: false
        type: string
      rebuild-all:
        description: Rebuild and republish every package in the registry, ignoring base-sha/head-sha.
        required: false
        type: boolean
        default: false
      retry-failed:
        description: Rebuild and republish packages with an open build-failure issue, ignoring base-sha/head-sha.
        required: false
        type: boolean
        default: false
      clean-only:
        description: >-
          Build nothing; just reconcile the published repo db against the
          current Registry and remove anything the Registry no longer
          tracks. Ignores base-sha/head-sha/rebuild-all/retry-failed.
        required: false
        type: boolean
        default: false
      package-names:
        description: >-
          Comma/whitespace-separated package names to build and republish,
          ignoring base-sha/head-sha/rebuild-all/retry-failed/clean-only.
          Each name must already exist in the Registry.
        required: false
        type: string
        default: ""
    secrets:
      R2_ENDPOINT:
        required: true
      R2_ACCESS_KEY_ID:
        required: true
      R2_SECRET_ACCESS_KEY:
        required: true
      R2_BUCKET:
        required: true
      GPG_PRIVATE_KEY:
        required: true
      GPG_PASSPHRASE:
        # Optional: a signing key made specifically for unattended CI use
        # commonly has no passphrase at all. If this secret doesn't exist,
        # `secrets: inherit` simply passes nothing and publish/minio.sh
        # signs with an empty passphrase, which is correct for such a key.
        required: false
      WEBSITE_KIT_PUSH_TOKEN:
        required: true

permissions:
  contents: write
  issues: write
  actions: read
  # For the "attest package provenance" step in the publish job below:
  # id-token to request the short-lived OIDC token Sigstore signs with,
  # attestations to write the resulting attestation to this repo. Public
  # repos only unless the org is on GitHub Enterprise Cloud.
  id-token: write
  attestations: write

env:
  WORKFLOW_BUILD_KIT_REF: main
  WEBSITE_KIT_REPO: Akaere-s-Packages/WebSite-Kit
  PAGES_DOMAIN: packages.pysio.online

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      layer0: ${{ steps.resolve.outputs.layer0 }}
      layer1: ${{ steps.resolve.outputs.layer1 }}
      layer2: ${{ steps.resolve.outputs.layer2 }}
      layer3: ${{ steps.resolve.outputs.layer3 }}
      layer4: ${{ steps.resolve.outputs.layer4 }}
      removed-count: ${{ steps.detect.outputs.removed-count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: Akaere-s-Packages/workflow-build-kit
          ref: ${{ env.WORKFLOW_BUILD_KIT_REF }}
          path: .build-kit
      - id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          # Piped through env rather than interpolated straight into the
          # script below (unlike the boolean/SHA inputs elsewhere in this
          # step): this one is free-form text a human types into the
          # workflow_dispatch form, and splicing that directly into `${{
          # }}` inside a run: script is exactly the classic GitHub Actions
          # script-injection hole — the expression is substituted as raw
          # text before bash ever parses it. Reading it back out of the
          # environment at runtime instead means its content is just a
          # string value, never executed as script.
          PACKAGE_NAMES: ${{ inputs.package-names }}
        run: |
          if [[ -n "$PACKAGE_NAMES" ]]; then
            # Accept commas and/or any whitespace as separators so
            # "pkg-a, pkg-b" and "pkg-a pkg-b" both work from the
            # workflow_dispatch text box.
            requested="$(printf '%s' "$PACKAGE_NAMES" | tr ',' '\n' | tr -s '[:space:]' '\n' | sed '/^$/d' | sort -u)"
            if [[ -z "$requested" ]]; then
              echo "::error::package-names ('$PACKAGE_NAMES') contained no usable package name after parsing" >&2
              exit 1
            fi
            printf '%s\n' "$requested" | jq -R . | jq -s . > names.json
            bash .build-kit/scripts/registry/detect_changed_packages.sh --names names.json > changed.json
            resolved="$(jq -r '.[].name' changed.json | sort -u)"
            missing="$(comm -23 <(printf '%s\n' "$requested") <(printf '%s\n' "$resolved") || true)"
            if [[ -n "$missing" ]]; then
              echo "::warning::requested package name(s) not found in the registry, skipped: $(tr '\n' ' ' <<< "$missing")"
            fi
            removed_count=0
          elif [[ "${{ inputs.clean-only }}" == "true" ]]; then
            # Nothing to build — resolve_build_order.sh (called next, in
            # the `resolve` step) treats an empty changed set as "produce
            # all-empty layers" with no AUR lookup at all, so this alone is
            # enough to skip every build-wave-* job. removed-count stays 0
            # since there's no diff to count; the publish job's `if:` below
            # has a dedicated `inputs.clean-only` branch to still run it.
            echo '[]' > changed.json
            removed_count=0
          elif [[ "${{ inputs.rebuild-all }}" == "true" ]]; then
            bash .build-kit/scripts/registry/detect_changed_packages.sh --all > changed.json
            removed_count=0
          elif [[ "${{ inputs.retry-failed }}" == "true" ]]; then
            gh issue list --repo "$GITHUB_REPOSITORY" --state open --label build-failure --limit 1000 --json title |
              jq '[.[].title | select(startswith("[build-failure] ")) | ltrimstr("[build-failure] ")]' > failed-names.json
            bash .build-kit/scripts/registry/detect_changed_packages.sh --names failed-names.json > changed.json
            removed_count=0
          else
            bash .build-kit/scripts/registry/detect_changed_packages.sh "${{ inputs.base-sha }}" "${{ inputs.head-sha }}" > changed.json
            # Packages deleted between base-sha and head-sha don't need
            # building (detect_changed_packages.sh already excludes them
            # via --diff-filter=d) but DO need the publish job to run at
            # all so it can reconcile them out of the repo db — a push
            # that ONLY deletes packages would otherwise stage nothing to
            # build and the publish job's `if:` below would skip it
            # entirely. This is only a trigger signal; the actual pruning
            # in publish_all.sh reconciles against the full current
            # Registry tree, not this specific list.
            removed_count=$(git diff --diff-filter=D --name-only "${{ inputs.base-sha }}" "${{ inputs.head-sha }}" -- '*/*/*/*.toml' | grep -c . || true)
          fi
          echo "changed packages:"; cat changed.json
          echo "removed toml count: $removed_count"
          echo "removed-count=$removed_count" >> "$GITHUB_OUTPUT"
      - name: build depgraph
        run: make -C .build-kit/tools/depgraph
      - id: resolve
        run: |
          # Expands the literally-changed set to everything hard-dependent
          # on it (e.g. bumping asusctl also pulls in rog-control-center,
          # which depends on it) and lays the result out in up to 5
          # dependency-ordered build layers ("waves"). Padded to exactly 5
          # entries by resolve_build_order.sh, so layer0..layer4 are always
          # valid — no need to guard against a shorter array.
          bash .build-kit/scripts/registry/resolve_build_order.sh \
            --registry-root . --changed changed.json --max-layers 5 > layers.json
          echo "resolved build layers:"; cat layers.json
          # Bare assignments (not `echo "x=$(...)"`) so a genuine jq
          # failure trips `set -e` instead of silently writing an empty
          # layer to $GITHUB_OUTPUT.
          layer0=$(jq -c '.[0]' layers.json)
          layer1=$(jq -c '.[1]' layers.json)
          layer2=$(jq -c '.[2]' layers.json)
          layer3=$(jq -c '.[3]' layers.json)
          layer4=$(jq -c '.[4]' layers.json)
          {
            echo "layer0=$layer0"
            echo "layer1=$layer1"
            echo "layer2=$layer2"
            echo "layer3=$layer3"
            echo "layer4=$layer4"
          } >> "$GITHUB_OUTPUT"

  build-wave-0:
    needs: detect-changes
    if: needs.detect-changes.outputs.layer0 != '[]'
    runs-on: ubuntu-latest
    # Deliberately NOT `container: archlinux:base-devel` at the job level:
    # actions/checkout needs a real `git` binary, and the base-devel group
    # doesn't include one, so checkout would fail before package.sh ever
    # gets a chance to install it. Instead we checkout normally on the
    # host runner (which already has git + Docker) and only run the actual
    # makepkg build inside the Arch container via `docker run`, bind-mounting
    # the checkout. ubuntu-latest ships Docker pre-installed for this.
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect-changes.outputs.layer0) }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: registry
      - uses: actions/checkout@v4
        with:
          repository: Akaere-s-Packages/workflow-build-kit
          ref: ${{ env.WORKFLOW_BUILD_KIT_REF }}
          path: build-kit
      - id: meta
        run: |
          # Assign to plain variables first, *then* echo them — a command
          # substitution that fails inside `echo "key=$(...)"` directly
          # does NOT trip `set -e` (echo itself still "succeeds"), so a
          # genuine parse failure would otherwise be silently swallowed
          # into an empty value instead of failing this step loudly.
          source build-kit/scripts/lib/toml.sh
          pkgbase="$(toml_get "registry/${{ matrix.path }}" pkgbase)"
          [[ -z "$pkgbase" ]] && pkgbase="${{ matrix.name }}"
          aur_depends="$(toml_get_list "registry/${{ matrix.path }}" aur_depends)"
          {
            echo "pkgbase=$pkgbase"
            echo "aur_depends=$aur_depends"
          } >> "$GITHUB_OUTPUT"
      - name: build (inside archlinux:base-devel)
        id: build
        continue-on-error: true
        run: |
          mkdir -p out
          case "${{ matrix.distro }}" in
            archlinux) image="archlinux:base-devel" ;;
            *) echo "::error::no build container configured for distro '${{ matrix.distro }}'" >&2; exit 1 ;;
          esac
          docker run --rm -v "$PWD:/workspace" -w /workspace "$image" \
            bash "build-kit/backends/${{ matrix.distro }}/build.sh" "${{ matrix.name }}" "${{ steps.meta.outputs.pkgbase }}" out ${{ steps.meta.outputs.aur_depends }}
      - name: resolve job url
        id: jobinfo
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            const job = data.jobs.find(j => j.name.includes('${{ matrix.name }}'));
            core.setOutput('url', job ? job.html_url
              : `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`);
      - name: write manifest
        if: always()
        run: |
          status="build_failed"
          [[ "${{ steps.build.outcome }}" == "success" ]] && status="built"
          cat > out/manifest.json <<EOF
          {"distro":"${{ matrix.distro }}","type":"${{ matrix.type }}","name":"${{ matrix.name }}","pkgbase":"${{ steps.meta.outputs.pkgbase }}","build_outcome":"$status","job_url":"${{ steps.jobinfo.outputs.url }}"}
          EOF
      - name: stage artifact filenames
        if: always()
        run: bash build-kit/scripts/build/stage_artifact.sh stage out artifact
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-${{ matrix.name }}
          path: artifact/
          if-no-files-found: warn

  build-wave-1:
    needs: [detect-changes, build-wave-0]
    # `always()` overrides the default "skip if a needed job was skipped"
    # behavior — build-wave-0 is legitimately skipped whenever layer0 is
    # empty, and that must not skip this wave too.
    if: always() && needs.detect-changes.outputs.layer1 != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect-changes.outputs.layer1) }}
    steps:
      - uses: actions/checkout@v4
