        if: always()
        with:
          name: build-${{ matrix.name }}
          path: artifact/
          if-no-files-found: warn

  build-wave-4:
    # Only needs build-wave-3 directly — the full chain is enforced
    # transitively the same way build-wave-3 is relative to the ones
    # before it.
    needs: [detect-changes, build-wave-3]
    if: always() && needs.detect-changes.outputs.layer4 != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect-changes.outputs.layer4) }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: registry
      - uses: actions/checkout@v4
        with:
          repository: Akaere-s-Packages/workflow-build-kit
          ref: ${{ env.WORKFLOW_BUILD_KIT_REF }}
          path: build-kit
      - id: meta
        run: |
          # Assign to plain variables first, *then* echo them — a command
          # substitution that fails inside `echo "key=$(...)"` directly
          # does NOT trip `set -e` (echo itself still "succeeds"), so a
          # genuine parse failure would otherwise be silently swallowed
          # into an empty value instead of failing this step loudly.
          pkgbase=$(python3 -c "import tomllib; print(tomllib.load(open('registry/${{ matrix.path }}','rb'))['PACKAGES'].get('pkgbase','${{ matrix.name }}'))")
          aur_depends=$(python3 -c "import tomllib; print(' '.join(tomllib.load(open('registry/${{ matrix.path }}','rb'))['PACKAGES'].get('aur_depends',[])))")
          {
            echo "pkgbase=$pkgbase"
            echo "aur_depends=$aur_depends"
          } >> "$GITHUB_OUTPUT"
      - name: build (inside archlinux:base-devel)
