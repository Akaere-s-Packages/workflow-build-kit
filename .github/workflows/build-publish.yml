name: build-publish

# Called by Registry's own push-to-main workflow after a PR merges. Builds
# every changed package (plus anything hard-dependent on it, in dependency
# order — see scripts/registry/resolve_build_order.py), GPG-signs and
# publishes the successful ones to the R2-backed pacman repo, refreshes
# WebSite-Kit's data, updates Registry/README.md, and opens/closes
# per-package failure Issues on Registry.
#
# Internal checkouts of this repo (workflow-build-kit) are pinned to
# `main` for simplicity; move to a tagged release once this is stable.

on:
  workflow_call:
    inputs:
      base-sha:
        description: Ignored when rebuild-all is true.
        required: false
        type: string
      head-sha:
        description: Ignored when rebuild-all is true.
        required: false
        type: string
      rebuild-all:
        description: Rebuild and republish every package in the registry, ignoring base-sha/head-sha.
        required: false
        type: boolean
        default: false
    secrets:
      R2_ENDPOINT:
        required: true
      R2_ACCESS_KEY_ID:
        required: true
      R2_SECRET_ACCESS_KEY:
        required: true
      R2_BUCKET:
        required: true
      GPG_PRIVATE_KEY:
        required: true
      GPG_PASSPHRASE:
        # Optional: a signing key made specifically for unattended CI use
        # commonly has no passphrase at all. If this secret doesn't exist,
        # `secrets: inherit` simply passes nothing and publish/minio.sh
        # signs with an empty passphrase, which is correct for such a key.
        required: false
      WEBSITE_KIT_PUSH_TOKEN:
        required: true

permissions:
  contents: write
  issues: write
  actions: read

env:
  WORKFLOW_BUILD_KIT_REF: main
  WEBSITE_KIT_REPO: Akaere-s-Packages/WebSite-Kit
  PAGES_DOMAIN: packages.pysio.online

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      layer0: ${{ steps.resolve.outputs.layer0 }}
      layer1: ${{ steps.resolve.outputs.layer1 }}
      layer2: ${{ steps.resolve.outputs.layer2 }}
      layer3: ${{ steps.resolve.outputs.layer3 }}
      layer4: ${{ steps.resolve.outputs.layer4 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: Akaere-s-Packages/workflow-build-kit
          ref: ${{ env.WORKFLOW_BUILD_KIT_REF }}
          path: .build-kit
      - id: detect
        run: |
          if [[ "${{ inputs.rebuild-all }}" == "true" ]]; then
            .build-kit/scripts/registry/detect_changed_packages.sh --all > changed.json
          else
            .build-kit/scripts/registry/detect_changed_packages.sh "${{ inputs.base-sha }}" "${{ inputs.head-sha }}" > changed.json
          fi
          echo "changed packages:"; cat changed.json
      - id: resolve
        run: |
          # Expands the literally-changed set to everything hard-dependent
          # on it (e.g. bumping asusctl also pulls in rog-control-center,
          # which depends on it) and lays the result out in up to 5
          # dependency-ordered build layers ("waves"). Padded to exactly 5
          # entries by resolve_build_order.py, so layer0..layer4 are always
          # valid — no need to guard against a shorter array.
          python3 .build-kit/scripts/registry/resolve_build_order.py \
            --registry-root . --changed changed.json --max-layers 5 > layers.json
          echo "resolved build layers:"; cat layers.json
          # Bare assignments (not `echo "x=$(...)"`) so a genuine jq
          # failure trips `set -e` instead of silently writing an empty
          # layer to $GITHUB_OUTPUT.
          layer0=$(jq -c '.[0]' layers.json)
          layer1=$(jq -c '.[1]' layers.json)
          layer2=$(jq -c '.[2]' layers.json)
          layer3=$(jq -c '.[3]' layers.json)
          layer4=$(jq -c '.[4]' layers.json)
          {
            echo "layer0=$layer0"
            echo "layer1=$layer1"
            echo "layer2=$layer2"
            echo "layer3=$layer3"
            echo "layer4=$layer4"
          } >> "$GITHUB_OUTPUT"

  build-wave-0:
    needs: detect-changes
    if: needs.detect-changes.outputs.layer0 != '[]'
    runs-on: ubuntu-latest
    # Deliberately NOT `container: archlinux:base-devel` at the job level:
    # actions/checkout needs a real `git` binary, and the base-devel group
    # doesn't include one, so checkout would fail before package.sh ever
    # gets a chance to install it. Instead we checkout normally on the
    # host runner (which already has git + Docker) and only run the actual
    # makepkg build inside the Arch container via `docker run`, bind-mounting
    # the checkout. ubuntu-latest ships Docker pre-installed for this.
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect-changes.outputs.layer0) }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: registry
      - uses: actions/checkout@v4
        with:
          repository: Akaere-s-Packages/workflow-build-kit
          ref: ${{ env.WORKFLOW_BUILD_KIT_REF }}
          path: build-kit
      - id: meta
        run: |
          # Assign to plain variables first, *then* echo them — a command
          # substitution that fails inside `echo "key=$(...)"` directly
          # does NOT trip `set -e` (echo itself still "succeeds"), so a
          # genuine parse failure would otherwise be silently swallowed
          # into an empty value instead of failing this step loudly.
          pkgbase=$(python3 -c "import tomllib; print(tomllib.load(open('registry/${{ matrix.path }}','rb'))['PACKAGES'].get('pkgbase','${{ matrix.name }}'))")
          aur_depends=$(python3 -c "import tomllib; print(' '.join(tomllib.load(open('registry/${{ matrix.path }}','rb'))['PACKAGES'].get('aur_depends',[])))")
          {
            echo "pkgbase=$pkgbase"
            echo "aur_depends=$aur_depends"
          } >> "$GITHUB_OUTPUT"
      - name: build (inside archlinux:base-devel)
        id: build
        continue-on-error: true
        run: |
          mkdir -p out
          docker run --rm -v "$PWD:/workspace" -w /workspace archlinux:base-devel \
            bash build-kit/scripts/build/package.sh "${{ matrix.name }}" "${{ steps.meta.outputs.pkgbase }}" out ${{ steps.meta.outputs.aur_depends }}
      - name: resolve job url
        id: jobinfo
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            const job = data.jobs.find(j => j.name.includes('${{ matrix.name }}'));
            core.setOutput('url', job ? job.html_url
              : `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`);
      - name: write manifest
        if: always()
        run: |
          status="build_failed"
          [[ "${{ steps.build.outcome }}" == "success" ]] && status="built"
          cat > out/manifest.json <<EOF
          {"distro":"${{ matrix.distro }}","type":"${{ matrix.type }}","name":"${{ matrix.name }}","pkgbase":"${{ steps.meta.outputs.pkgbase }}","build_outcome":"$status","job_url":"${{ steps.jobinfo.outputs.url }}"}
          EOF
      - name: stage artifact filenames
        if: always()
        run: python3 build-kit/scripts/build/stage_artifact.py stage out artifact
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-${{ matrix.name }}
          path: artifact/
          if-no-files-found: warn

  build-wave-1:
    needs: [detect-changes, build-wave-0]
    # `always()` overrides the default "skip if a needed job was skipped"
    # behavior — build-wave-0 is legitimately skipped whenever layer0 is
    # empty, and that must not skip this wave too.
    if: always() && needs.detect-changes.outputs.layer1 != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect-changes.outputs.layer1) }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: registry
      - uses: actions/checkout@v4
        with:
          repository: Akaere-s-Packages/workflow-build-kit
          ref: ${{ env.WORKFLOW_BUILD_KIT_REF }}
          path: build-kit
      - id: meta
        run: |
          # Assign to plain variables first, *then* echo them — a command
          # substitution that fails inside `echo "key=$(...)"` directly
          # does NOT trip `set -e` (echo itself still "succeeds"), so a
          # genuine parse failure would otherwise be silently swallowed
          # into an empty value instead of failing this step loudly.
          pkgbase=$(python3 -c "import tomllib; print(tomllib.load(open('registry/${{ matrix.path }}','rb'))['PACKAGES'].get('pkgbase','${{ matrix.name }}'))")
          aur_depends=$(python3 -c "import tomllib; print(' '.join(tomllib.load(open('registry/${{ matrix.path }}','rb'))['PACKAGES'].get('aur_depends',[])))")
          {
            echo "pkgbase=$pkgbase"
            echo "aur_depends=$aur_depends"
          } >> "$GITHUB_OUTPUT"
      - name: build (inside archlinux:base-devel)
        id: build
        continue-on-error: true
        run: |
          mkdir -p out
          docker run --rm -v "$PWD:/workspace" -w /workspace archlinux:base-devel \
            bash build-kit/scripts/build/package.sh "${{ matrix.name }}" "${{ steps.meta.outputs.pkgbase }}" out ${{ steps.meta.outputs.aur_depends }}
      - name: resolve job url
        id: jobinfo
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            const job = data.jobs.find(j => j.name.includes('${{ matrix.name }}'));
            core.setOutput('url', job ? job.html_url
              : `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`);
      - name: write manifest
        if: always()
        run: |
          status="build_failed"
          [[ "${{ steps.build.outcome }}" == "success" ]] && status="built"
          cat > out/manifest.json <<EOF
          {"distro":"${{ matrix.distro }}","type":"${{ matrix.type }}","name":"${{ matrix.name }}","pkgbase":"${{ steps.meta.outputs.pkgbase }}","build_outcome":"$status","job_url":"${{ steps.jobinfo.outputs.url }}"}
          EOF
      - name: stage artifact filenames
        if: always()
        run: python3 build-kit/scripts/build/stage_artifact.py stage out artifact
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-${{ matrix.name }}
          path: artifact/
          if-no-files-found: warn

  build-wave-2:
    # Only needs build-wave-1 directly — GitHub still enforces the full
    # chain transitively (build-wave-1 already needs build-wave-0), so
    # this correctly starts after both earlier waves regardless of
    # whether either was skipped.
    needs: [detect-changes, build-wave-1]
    if: always() && needs.detect-changes.outputs.layer2 != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect-changes.outputs.layer2) }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: registry
      - uses: actions/checkout@v4
        with:
          repository: Akaere-s-Packages/workflow-build-kit
          ref: ${{ env.WORKFLOW_BUILD_KIT_REF }}
          path: build-kit
      - id: meta
        run: |
          # Assign to plain variables first, *then* echo them — a command
          # substitution that fails inside `echo "key=$(...)"` directly
          # does NOT trip `set -e` (echo itself still "succeeds"), so a
          # genuine parse failure would otherwise be silently swallowed
          # into an empty value instead of failing this step loudly.
          pkgbase=$(python3 -c "import tomllib; print(tomllib.load(open('registry/${{ matrix.path }}','rb'))['PACKAGES'].get('pkgbase','${{ matrix.name }}'))")
          aur_depends=$(python3 -c "import tomllib; print(' '.join(tomllib.load(open('registry/${{ matrix.path }}','rb'))['PACKAGES'].get('aur_depends',[])))")
          {
            echo "pkgbase=$pkgbase"
            echo "aur_depends=$aur_depends"
          } >> "$GITHUB_OUTPUT"
      - name: build (inside archlinux:base-devel)
