        run: |
          # Assign to plain variables first, *then* echo them — a command
          # substitution that fails inside `echo "key=$(...)"` directly
          # does NOT trip `set -e` (echo itself still "succeeds"), so a
          # genuine parse failure would otherwise be silently swallowed
          # into an empty value instead of failing this step loudly.
          source build-kit/scripts/lib/toml.sh
          pkgbase="$(toml_get "registry/${{ matrix.path }}" pkgbase)"
          [[ -z "$pkgbase" ]] && pkgbase="${{ matrix.name }}"
