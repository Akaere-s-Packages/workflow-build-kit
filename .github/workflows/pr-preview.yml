name: pr-preview

# Called by Registry's PR workflow. Validates + builds changed packages
# but never signs or publishes anything, then diffs the build output
# against what's already publicly published (fetched straight from
# WebSite-Kit's GitHub Pages JSON) and posts/updates one PR comment per
# changed package.
#
# Deliberately accepts no secrets at all, so it's safe to run even on PRs
# from forks.

on:
  workflow_call:
    inputs:
      base-sha:
        required: true
        type: string
      head-sha:
        required: true
        type: string
      pr-number:
        required: true
        type: number

permissions:
  pull-requests: write
  contents: read

env:
  WORKFLOW_BUILD_KIT_REF: main
  PUBLISHED_BASE_URL: https://packages.pysio.online

jobs:
  detect-and-validate:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.resolve.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: Akaere-s-Packages/workflow-build-kit
          ref: ${{ env.WORKFLOW_BUILD_KIT_REF }}
          path: .build-kit
      - id: detect
        run: |
          bash .build-kit/scripts/registry/detect_changed_packages.sh "${{ inputs.base-sha }}" "${{ inputs.head-sha }}" > changed.json
          echo "changed packages:"; cat changed.json
      - name: validate schema
        run: |
          paths=$(jq -r '[.[].path] | join(" ")' changed.json)
          [[ -n "$paths" ]] && bash .build-kit/scripts/registry/validate_schema.sh $paths || echo "nothing to validate"
      - name: build depgraph
        run: make -C .build-kit/tools/depgraph
      - id: resolve
        run: |
          # Expand to everything hard-dependent on what changed (e.g. a PR
          # touching only asusctl also previews rog-control-center, since
          # it depends on it) — order doesn't matter for the preview build
          # (nothing here needs makepkg-time ordering), so flatten straight
          # into one list for a single parallel matrix.
          bash .build-kit/scripts/registry/resolve_build_order.sh \
            --registry-root . --changed changed.json --max-layers 5 > layers.json
          echo "resolved packages:"; cat layers.json
          # Bare assignment so a genuine jq failure trips `set -e` instead
          # of silently writing an empty list to $GITHUB_OUTPUT.
          packages=$(jq -c 'add' layers.json)
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  build:
    needs: detect-and-validate
    if: needs.detect-and-validate.outputs.packages != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect-and-validate.outputs.packages) }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: registry
      - uses: actions/checkout@v4
        with:
          repository: Akaere-s-Packages/workflow-build-kit
          ref: ${{ env.WORKFLOW_BUILD_KIT_REF }}
          path: build-kit
      - uses: actions/checkout@v4
        with:
          repository: Akaere-s-Packages/Registry
          ref: ${{ inputs.base-sha }}
          path: registry-base
      - id: meta
        run: |
          # Bare assignments first, *then* echo them — see build-publish.yml's
          # equivalent step for why `echo "key=$(...)"` directly doesn't
          # trip `set -e` on a genuine failure the way a plain assignment does.
          source build-kit/scripts/lib/toml.sh
          pkgbase="$(toml_get "registry/${{ matrix.path }}" pkgbase)"
          [[ -z "$pkgbase" ]] && pkgbase="${{ matrix.name }}"
          aur_depends="$(toml_get_list "registry/${{ matrix.path }}" aur_depends)"
          new_version="$(toml_get "registry/${{ matrix.path }}" version)"
          old_version=""
          [[ -f "registry-base/${{ matrix.path }}" ]] && old_version="$(toml_get "registry-base/${{ matrix.path }}" version)"
          {
            echo "pkgbase=$pkgbase"
            echo "aur_depends=$aur_depends"
            echo "new_version=$new_version"
            echo "old_version=$old_version"
          } >> "$GITHUB_OUTPUT"
      - name: restore pacman package cache
        # Always on here (no manual trigger to hang a disable switch off
        # of — see build-publish.yml's use-cache input for the equivalent
        # on the manually-dispatched build paths). The exact key is unique
        # per run (github.run_id), same as build-publish.yml's, but both
        # share the same restore-keys prefix — so a PR's preview build
        # falls back to whatever build-and-publish (or an earlier preview
        # run) last saved, and vice versa, without either side needing to
        # know about the other's run.
        uses: actions/cache/restore@v4
        with:
          path: pkg-cache
          key: pacman-pkg-cache-${{ matrix.distro }}-${{ github.run_id }}
          restore-keys: |
            pacman-pkg-cache-${{ matrix.distro }}-
      - name: build (inside distro-specific container)
        id: build
        continue-on-error: true
        run: |
          mkdir -p out pkg-cache
          case "${{ matrix.distro }}" in
            archlinux) image="archlinux:base-devel" ;;
            *) echo "::error::no build container configured for distro '${{ matrix.distro }}'" >&2; exit 1 ;;
          esac
          docker run --rm -v "$PWD:/workspace" -v "$PWD/pkg-cache:/var/cache/pacman/pkg" -w /workspace "$image" \
            bash "build-kit/backends/${{ matrix.distro }}/build.sh" "${{ matrix.name }}" "${{ steps.meta.outputs.pkgbase }}" out ${{ steps.meta.outputs.aur_depends }}
      - name: save pacman package cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: pkg-cache
          key: pacman-pkg-cache-${{ matrix.distro }}-${{ github.run_id }}
      - name: resolve job url
        id: jobinfo
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            const job = data.jobs.find(j => j.name.includes('${{ matrix.name }}'));
            core.setOutput('url', job ? job.html_url
              : `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`);
      - name: build diff comment body
        id: diff
        run: |
          status="failure"
          [[ "${{ steps.build.outcome }}" == "success" ]] && status="success"
          args=(--name "${{ matrix.name }}" --new-version "${{ steps.meta.outputs.new_version }}"
                --build-status "$status" --job-url "${{ steps.jobinfo.outputs.url }}"
                --published-base-url "${{ env.PUBLISHED_BASE_URL }}")
          [[ -n "${{ steps.meta.outputs.old_version }}" ]] && args+=(--old-version "${{ steps.meta.outputs.old_version }}")
          [[ "$status" == "success" ]] && args+=(--file-list "out/file_list.json")
          bash build-kit/scripts/preview/diff.sh "${args[@]}" > comment_body.md
          cat comment_body.md
      - uses: actions/upload-artifact@v4
        with:
          name: comment-${{ matrix.name }}
          path: comment_body.md

  comment:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: comment-*
          path: comments
          merge-multiple: true
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const dir = 'comments';
            if (!fs.existsSync(dir)) return;
            for (const file of fs.readdirSync(dir)) {
              const body = fs.readFileSync(path.join(dir, file), 'utf8');
              const anchorMatch = body.match(/<!-- workflow-build-kit:(.+?) -->/);
              if (!anchorMatch) continue;
              const anchor = anchorMatch[0];
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: ${{ inputs.pr-number }},
              });
              const existing = comments.find(c => c.body.includes(anchor));
              if (existing) {
                await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
              } else {
                await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: ${{ inputs.pr-number }}, body });
              }
            }
